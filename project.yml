# XcodeGen spec. CI runs `xcodegen generate` to create FrugalityPug.xcodeproj (which is not committed).
# Add source files by dropping them into App/; do not edit generated project files.
name: FrugalityPug

options:
  bundleIdPrefix: com.frugalitypug
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FrugalityCore:
    path: Packages/FrugalityCore

targets:
  FrugalityPug:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: FrugalityCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Frugality Pug
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frugalitypug.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
